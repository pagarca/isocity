<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#283a37">
  <title>Isocity · Madrid</title>
  <style>
    :root{color-scheme:light;--ink:#243532;--muted:#60736c;--paper:#f6f0df;--edge:#c6c3aa;--green:#52745e;--gold:#e8bb5b}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#a8b999;color:var(--ink);font:14px/1.4 "Trebuchet MS",system-ui,sans-serif}
    canvas{display:block;width:100vw;height:100vh;touch-action:none;image-rendering:pixelated;cursor:grab}
    canvas.dragging{cursor:grabbing}
    .panel{position:fixed;background:var(--paper);border:2px solid #344941;box-shadow:4px 4px 0 #34494155}
    header{top:18px;left:18px;width:min(360px,calc(100vw - 36px));padding:15px 16px 12px}
    .eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 4px;color:var(--green);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .dot{width:9px;height:9px;background:var(--gold);border:2px solid var(--ink);display:inline-block}
    h1{font-size:25px;line-height:1;margin:0;letter-spacing:-.04em}
    .subhead{margin:5px 0 12px;color:var(--muted);font-size:12px}
    .rule{height:2px;background:#d9d2b8;margin:0 -16px 10px}
    #status{min-height:18px;margin:0 0 10px;font-size:12px;font-weight:700}
    .toolbar{display:flex;align-items:center;gap:8px}
    button{font:inherit;font-weight:800;color:var(--paper);background:var(--green);border:2px solid var(--ink);padding:7px 11px;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
    button:hover{background:#3f624c}button:active{transform:translate(2px,2px);box-shadow:none}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
    .hint{font-size:10px;color:var(--muted);line-height:1.25}
    .legend{position:fixed;right:18px;top:18px;padding:10px 12px;display:flex;gap:12px;align-items:center;font-size:10px;font-weight:800}
    .key{display:flex;align-items:center;gap:5px;white-space:nowrap}.swatch{width:12px;height:12px;border:1px solid #344941;display:inline-block}.swatch.building{background:#bd8264}.swatch.park{background:#83a66e}.swatch.road{background:#777b72}
    footer{left:18px;bottom:15px;max-width:min(680px,calc(100vw - 36px));padding:8px 11px;font-size:10px;color:#43564f;line-height:1.35}
    #credit:empty{display:none}.badge{display:inline-block;margin-right:7px;color:#42654d;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
    #hover-label{position:fixed;display:none;pointer-events:none;padding:5px 8px;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 #34494166;font-size:11px;font-weight:800;transform:translate(12px,12px);max-width:220px}
    @media(max-width:560px){header{top:10px;left:10px;padding:12px;width:min(330px,calc(100vw - 20px))}.rule{margin-left:-12px;margin-right:-12px}h1{font-size:22px}.legend{top:auto;right:10px;bottom:14px;gap:7px;padding:8px;font-size:9px}footer{left:10px;bottom:54px;max-width:calc(100vw - 20px)}.hint{display:none}}
  </style>
</head>
<body>
  <canvas aria-label="Mapa isométrico interactivo de edificios, calles y zonas verdes de Madrid"></canvas>
  <header class="panel">
    <p class="eyebrow"><span class="dot"></span> Atlas urbano · visor</p>
    <h1 id="scene-title">Isocity · Madrid</h1>
    <p class="subhead" id="scene-subtitle">Una ciudad, vista a escala de manzana</p>
    <div class="rule"></div>
    <p id="status" role="status" aria-live="polite">Cargando geometría del piloto…</p>
    <div class="toolbar"><button id="reset" type="button">Centrar escena</button><span class="hint">Arrastra para moverte<br>Rueda o pellizca para ampliar</span></div>
  </header>
  <aside class="panel legend" aria-label="Leyenda">
    <span class="key"><i class="swatch building"></i>Edificios</span>
    <span class="key"><i class="swatch park"></i>Parques</span>
    <span class="key"><i class="swatch road"></i>Calles</span>
  </aside>
  <footer class="panel"><span class="badge">Datos del piloto</span><span id="credit"></span></footer>
  <div id="hover-label"></div>
  <script src="map.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
